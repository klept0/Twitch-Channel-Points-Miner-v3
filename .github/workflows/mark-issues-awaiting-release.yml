name: Mark issues awaiting release

on:
  # Fork PRs receive a read-only token on pull_request, even after merging.
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  mark_issues:
    name: Mark linked issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Run only trusted default-branch automation with the write token.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Mark linked issues awaiting release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const automation = require('./.github/scripts/release-linked-issues.js');
            await automation.markIssuesAwaitingRelease({ github, context, core });
