name: Release Please

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: >-
          Publish an existing release again (Docker image, Windows files,
          issue closing) instead of running Release Please. Use it when a
          run created the release and then failed: a re-run sees no new
          release and skips publishing.
        required: false
        default: ''
      mark_latest:
        description: With release_tag, also mark that release as the latest release.
        type: boolean
        required: false
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release_please:
    name: Create release
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.existing.outputs.release_created || steps.release_retry_2.outputs.release_created || steps.release_retry_1.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.existing.outputs.tag_name || steps.release_retry_2.outputs.tag_name || steps.release_retry_1.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - name: Use the requested existing release
        if: ${{ inputs.release_tag }}
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null
          echo "release_created=true" >> "$GITHUB_OUTPUT"
          echo "tag_name=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Run Release Please
        if: ${{ !inputs.release_tag }}
        id: release
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: master

      - name: Wait before retrying Release Please
        if: steps.release.outcome == 'failure'
        shell: bash
        run: sleep 30

      - name: Retry Release Please
        if: steps.release.outcome == 'failure'
        id: release_retry_1
        continue-on-error: true
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: master

      - name: Wait before final Release Please attempt
        if: steps.release.outcome == 'failure' && steps.release_retry_1.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Run final Release Please attempt
        if: steps.release.outcome == 'failure' && steps.release_retry_1.outcome == 'failure'
        id: release_retry_2
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          target-branch: master

      # Fork releases use "prerelease": true only so Release Please keeps the
      # -post.N suffix (see AGENTS.md, Fork versioning). They are real
      # releases, so publish them as the latest release, not a pre-release.
      - name: Publish fork release as latest
        if: (steps.release_retry_2.outputs.release_created || steps.release_retry_1.outputs.release_created || steps.release.outputs.release_created) == 'true' || (steps.existing.outputs.release_created == 'true' && inputs.mark_latest)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.existing.outputs.tag_name || steps.release_retry_2.outputs.tag_name || steps.release_retry_1.outputs.tag_name || steps.release.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest

      - name: Checkout link automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release Please links PRs as /issues/N, which GitHub's in-page
      # navigation fails to open. The release is built from the release PR
      # body, so relinking it also fixes the notes of the next release. This
      # must finish before publish_docker rewrites the same release body.
      - name: Link PR references in release notes
        # Cosmetic; never block the release, Docker, or Windows jobs.
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.existing.outputs.tag_name || steps.release_retry_2.outputs.tag_name || steps.release_retry_1.outputs.tag_name || steps.release.outputs.tag_name }}
        with:
          script: |
            const automation = require('./.github/scripts/release-pull-links.js');
            await automation.linkReleasePullRequests({
              github,
              context,
              core,
              tag: process.env.RELEASE_TAG,
            });

  close_released_issues:
    name: Close released issues
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout released automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Close issues included in the release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        with:
          script: |
            const automation = require('./.github/scripts/release-linked-issues.js');
            await automation.closeReleasedIssues({
              github,
              context,
              core,
              tag: process.env.RELEASE_TAG,
            });

  publish_docker:
    name: Publish Docker image
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/deploy-docker.yml
    with:
      ref: ${{ needs.release_please.outputs.tag_name }}
    secrets: inherit

  build_windows_exe:
    name: Build Windows executable (${{ matrix.flavor }})
    needs: release_please
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [standard, portable]
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-windows.txt
          python -m pip install validators==0.22.0 pyinstaller==6.21.0

      - name: Build Windows executable
        shell: cmd
        # Use setup-python's interpreter; the py launcher would pick the
        # newest Python on the runner, which doesn't have PyInstaller.
        env:
          PYINSTALLER_PYTHON: python
        run: build_windows.bat ${{ matrix.flavor }}

      - name: Smoke-test Windows executable
        shell: pwsh
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          $exeName = if ($env:FLAVOR -eq "standard") { "TwitchChannelPointsMiner.exe" } else { "TwitchChannelPointsMiner-Portable.exe" }
          # --windowed is a GUI-subsystem exe, so a plain call here returns
          # before the process actually finishes and leaves $LASTEXITCODE
          # stale/empty; Start-Process -Wait is needed to block on it and
          # get its real exit code.
          $proc = Start-Process -FilePath "dist\$exeName" -ArgumentList "--self-test" -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Smoke test failed (exit code $($proc.ExitCode)) - the built exe is missing a GUI dependency"
          }

      - name: Upload built executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-exe-${{ matrix.flavor }}
          path: dist/TwitchChannelPointsMiner*.exe
          if-no-files-found: error

  publish_windows_exe:
    name: Publish Windows executable
    needs: [release_please, build_windows_exe]
    if: needs.release_please.outputs.release_created == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release_please.outputs.tag_name }}

      - name: Download standard executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe-standard
          path: dist

      - name: Download portable executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-exe-portable
          path: dist

      - name: Package executable zip
        id: package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^Twitch-Channel-Points-Miner-v2-', ''
          $zipName = "TwitchChannelPointsMiner-Portable-$version.zip"
          Compress-Archive -Path "dist/TwitchChannelPointsMiner-Portable.exe" -DestinationPath "dist/$zipName" -Force
          "zip_path=dist/$zipName" >> $env:GITHUB_OUTPUT

      - name: Build Windows installer
        id: installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^Twitch-Channel-Points-Miner-v2-', ''
          $compiler = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $compiler)) {
            choco install innosetup --no-progress --yes
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }
          if (-not (Test-Path $compiler)) {
            throw "Inno Setup compiler was not found at $compiler after installation"
          }
          & $compiler "/DMyAppVersion=$version" "windows_installer.iss"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "installer_path=dist/TwitchChannelPointsMiner-$version-Setup.exe" >> $env:GITHUB_OUTPUT

      # gh release upload only adds the files. softprops/action-gh-release
      # also rewrote the release body from a copy it read earlier, which could
      # drop the Docker image block publish_docker writes at the same time.
      # --clobber replaces the files when publishing an existing release again.
      - name: Upload Windows artifacts to release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release_please.outputs.tag_name }}
          ZIP_PATH: ${{ steps.package.outputs.zip_path }}
          INSTALLER_PATH: ${{ steps.installer.outputs.installer_path }}
        run: |
          gh release upload "$env:RELEASE_TAG" "$env:ZIP_PATH" "$env:INSTALLER_PATH" --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
